{% extends "base.html" %}

{% block title %}Sign in · Server monitor{% endblock %}

{% block content %}
  <div class="page-head">
    <div>
      <h1>Sign in</h1>
      <p class="lede">Use the admin account for this demo.</p>
    </div>
  </div>
  {% if error %}
    <p class="note">{{ error }}</p>
  {% endif %}
  <section class="card">
    <form action="{{ url_for('sign_in') }}" method="post">
      <label>
        Username
        <input type="text" name="username" value="admin" autocomplete="username" required>
      </label>
      <label>
        Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <div class="actions">
        <button type="submit">Sign in</button>
      </div>
    </form>
  </section>
{% endblock %}
